name: shukhee_sdk
description: >
  Flutter SDK for the Shukhee (SSK) teleconsultation integration — booking,
  status polling, and an embeddable top-level video-call WebView. Scoped to
  the 3 Shukhee consultation endpoints only; no dependency on any host app.
version: 0.2.0
homepage: https://github.com/Medtronic-LABS/shukhee_sdk
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.4
  webview_flutter_wkwebview: ^3.18.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
